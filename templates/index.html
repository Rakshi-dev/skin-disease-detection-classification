{% extends "import.html" %}
{% block content %}

<center>
    <br><h2>Skin disease detection and classification</h2><br>

    <form id="upload-file" method="post" action="/predict" enctype="multipart/form-data">
        <input type="file" name="file" class="btn btn-success" id="imageUpload" accept=".png, .jpg, .jpeg">
        <br><br>
        <button type="submit" class="btn btn-info btn-lg">Predict!</button>
    </form>

    <div class="image-section" style="display:none;">
        <img id="imagePreview" class="img-responsive" src="#" style="width:300px;height:300px;"/><br><br>
    </div>

    <div class="loader" style="display:none;"></div>

    <h3 id="result">
        <span> </span>
    </h3>

</center><br><br>
{% endblock %}
